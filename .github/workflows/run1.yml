name: Run 1 Foundation Shell

on:
  push:
  pull_request:

jobs:
  run1:
    name: Windows foundation checks
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run test:coverage

      - name: Electron smoke
        run: npm run e2e

      - name: Package shell
        run: npm run package

      - name: Make NSIS installer
        run: npm run make

      - name: Upload packaged shell
        uses: actions/upload-artifact@v4
        with:
          name: run1-shell
          path: out/
          if-no-files-found: error
