installed:
- concierge-jira
- git
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_specify lifecycle hook?
    description: Validate Specify artifacts and write Step Commit
    condition: null
  - extension: spec-validate
    command: speckit.spec-validate.validate
    enabled: true
    optional: true
    prompt: Spec generated. Run comprehension validation now?
    description: Run spec validation after specification is generated
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit specification changes?
    description: Auto-commit after specification
    condition: null
  after_tasks:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_tasks lifecycle hook?
    description: Validate Tasks artifacts and write Step Commit
    condition: null
  - extension: spec-validate
    command: speckit.spec-validate.validate-tasks
    enabled: true
    optional: true
    prompt: Tasks generated. Run task validation now?
    description: Run task validation after tasks are generated
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit task changes?
    description: Auto-commit after task generation
    condition: null
  - extension: concierge-jira
    command: speckit.concierge-jira.specstoissues
    enabled: true
    optional: true
    prompt: Create Jira issues from tasks?
    description: Automatically create Jira hierarchy after task generation
    condition: null
  before_implement:
  - extension: spec-validate
    command: speckit.spec-validate.gate
    enabled: true
    optional: false
    prompt: Execute speckit.spec-validate.gate?
    description: Hard gate implementation on validation and review policy
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before implementation?
    description: Auto-commit before implementation
    condition: null
  before_constitution:
  - extension: git
    command: speckit.git.initialize
    enabled: true
    optional: false
    prompt: Execute speckit.git.initialize?
    description: Initialize Git repository before constitution setup
    condition: null
  before_specify:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_specify lifecycle hook?
    description: Validate prerequisites and mark Specify pending
    condition: null
  - extension: git
    command: speckit.git.feature
    enabled: true
    optional: false
    prompt: Execute speckit.git.feature?
    description: Create feature branch before specification
    condition: null
  before_clarify:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_clarify lifecycle hook?
    description: Validate prerequisites and mark Clarify pending
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before clarification?
    description: Auto-commit before spec clarification
    condition: null
  before_plan:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_plan lifecycle hook?
    description: Validate prerequisites and mark Plan pending
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before planning?
    description: Auto-commit before implementation planning
    condition: null
  before_tasks:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_tasks lifecycle hook?
    description: Validate prerequisites and mark Tasks pending
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before task generation?
    description: Auto-commit before task generation
    condition: null
  before_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before checklist?
    description: Auto-commit before checklist generation
    condition: null
  before_analyze:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_analyze lifecycle hook?
    description: Validate prerequisites and mark Analyze pending
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before analysis?
    description: Auto-commit before analysis
    condition: null
  before_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit outstanding changes before issue sync?
    description: Auto-commit before tasks-to-issues conversion
    condition: null
  after_constitution:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit constitution changes?
    description: Auto-commit after constitution update
    condition: null
  after_clarify:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_clarify lifecycle hook?
    description: Validate Clarify artifacts and write Step Commit
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit clarification changes?
    description: Auto-commit after spec clarification
    condition: null
  after_plan:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_plan lifecycle hook?
    description: Validate Plan artifacts and write Step Commit
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit plan changes?
    description: Auto-commit after implementation planning
    condition: null
  after_implement:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit implementation changes?
    description: Auto-commit after implementation
    condition: null
  after_checklist:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit checklist changes?
    description: Auto-commit after checklist generation
    condition: null
  after_analyze:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_analyze lifecycle hook?
    description: Validate Analyze artifacts and write Step Commit
    condition: null
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit analysis results?
    description: Auto-commit after analysis
    condition: null
  after_taskstoissues:
  - extension: git
    command: speckit.git.commit
    enabled: true
    optional: true
    prompt: Commit after syncing issues?
    description: Auto-commit after tasks-to-issues conversion
    condition: null
  before_review:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge before_review lifecycle hook?
    description: Validate prerequisites and mark Review pending
    condition: null
  after_review:
  - extension: concierge
    command: concierge.stepLifecycle.dispatch
    enabled: true
    optional: false
    prompt: Execute Concierge after_review lifecycle hook?
    description: Validate Review artifacts and write Step Commit
    condition: null
